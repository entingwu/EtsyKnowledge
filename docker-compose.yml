# Etsy KB（CedarSeaGoods）专用基础设施：Milvus(standalone) + Neo4j + MongoDB + MinIO + Attu
# 用法：docker compose up -d   （在本目录执行）
# 与 knowledge_base 项目（kb-*）完全隔离：项目名、容器名、网络、数据目录、宿主机端口都不同，两套可以同时运行
# MinIO 一份两用 —— Milvus 内部用 a-bucket，应用用 etsy-kb（见 .env 的 MINIO_BUCKET_NAME）
#
# 宿主机端口（课程默认端口 → 本项目）：
#   MinIO   9000/9001   → 9100/9101
#   Milvus  19530/9091  → 19540/9191
#   Neo4j   7474/7687   → 7475/7688
#   Mongo   27017       → 27018
#   Attu    8080        → 8081

name: etsy-kb

services:
  etcd:
    container_name: etsy-kb-etcd
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: etsy-kb-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z   # 2024-12-18 已无法从 Docker Hub/quay 拉取，用本地已有版本（控制台功能完整）
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"   # S3 API
      - "9101:9001"   # 控制台 http://127.0.0.1:9101
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]   # 镜像里没有 curl，用自带的 mc
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: etsy-kb-milvus
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19540:19530"  # gRPC
      - "9191:9091"    # 健康检查 http://127.0.0.1:9191/healthz
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio

  neo4j:
    container_name: etsy-kb-neo4j
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/123123123
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7475:7474"   # 浏览器 http://127.0.0.1:7475
      - "7688:7687"   # bolt://127.0.0.1:7688
    volumes:
      - ./volumes/neo4j/data:/data
      - ./volumes/neo4j/logs:/logs

  mongo:
    container_name: etsy-kb-mongo
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "123123"
    ports:
      - "27018:27017"
    volumes:
      - ./volumes/mongo:/data/db

  attu:
    container_name: etsy-kb-attu
    image: zilliz/attu:v2.5.10
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8081:3000"   # 浏览器 http://127.0.0.1:8081
    depends_on:
      - milvus
