[project]
name = "etsy-knowledge"
version = "0.1.0"
description = "掌柜智库 × CedarSeaGoods（Etsy）知识库"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.10.1",
    "fastapi>=0.138.1",
    "grandalf>=0.8",
    "langchain>=1.3.11",
    "langchain-openai>=1.3.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.6",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "modelscope>=1.38.0",
    "pymilvus[model]>=3.0.0",
    "logger>=1.4",
    "openai-agents>=0.18.2",
    "dashscope>=1.26.3",
    "uvicorn[standard]>=0.51.0",
    "neo4j>=6.4.0",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledgebase"]
